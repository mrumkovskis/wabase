######################################
#    Wabase Reference Config File    #
######################################
app {
  home = "/home/my-wabase-app"
  views-api.uri-prefix = "/"
  files.path = ${app.home}/files
  file-cleanup.cp = null
  current-user-key-name = current_user
  user-credentials-key-name = credentials

  action-for-http.post  =  post     # 'insert' for legacy applications
  action-for-http.put   =  put      # 'update' for legacy applications
  action-for-key-update = "update+" # 'update' for legacy applications
  action-legacy-mapping =  false    # 'true'   for legacy applications

  audit-max-content-size = 256 K                  # Max content size (i.e. http body) to include content in audit record
                                                  # Ensure AuditRecord (req + resp + etc) fits within bufferedAudit.reader.maxRecordSize!
  audit-pool-name  = audit_write
  audit-queue.path = ${app.home}/audit-queue      # this path must NOT be on network or temp and must NOT be shared.
  host = null                                     # "http://127.0.0.1"
  upload.size-limit       = 8 m
  db-data-file-max-size   = 8 m
  db-data-file-max-sizes {
    # name = 2 m
  }
  deferred-requests {
    enabled = true
    worker-count          = 2                     # ensure there are connections left in pool for other tasks, too!
    default-timeout       = 180 s
    cleanup-job-interval  = 1800 s
    # requests = [
    #   my_slow_1,
    #   my_slow_n,
    # ]
    requests = []
    timeouts {
      # my_slow_1 = 60s
    }
    modules {
      # module_1.worker-count = 2
      # module_2.worker-count = 5
    }
    storage {
      # cp                  = # optional
      file-streamer {
        # cp                  = # optional
        files.path            = ${app.home}/files-for-deferred
        file-info-table       = deferred_file_info
        file-body-info-table  = deferred_file_body_info
        sha-col-name          = sha_256
      }
    }
    factory-class         = org.wabase.WabaseDeferredControl
    storage-factory-class = org.wabase.DbDeferredStorageFactory
  }

  field-filter-parameter-name = "fields"          # parameter name in uri query to filter result fields for 'list', 'get' and 'create' actions, may be null

  # function returning HttpRequest => Map[String, Any] to override default parameter decoding, if returns null default parameter encoding is enacted
  query-parameters-decoder = null

  serialization-buffer-size   = 32 k

  email {
    enabled  = true
    sender   = org.wabase.DefaultWabaseEmailSender
  }

  job {
    scheduler-initializer = null
    #scheduler-initializer = org.wabase.scheduler.QuartzScheduler.init
    actor    = org.wabase.WabaseJobActor          # to disable wabase job actor assign value null
    actor-name = "wabase-job-actor"
    max-time = 1 hour                             # job max duration - when is it safe to restart job if lock is not released
    job-status-cp = "main"                        # connection pool for cron_job_status table
    on-start-job = null
    clean-jobs-on-start = true
  }

  public-api {
    role-name        = "public"                     # pseudo-role to allow access to view api without user and role check
    views-uri-prefix = "/public"
    views-location-pattern = "^public/.*\\.yaml$"   # path/and/filename pattern to allow access to view api without user and role check
  }

  server {
    bind-address               = "0.0.0.0"
    invoke-before-start        = ""               # method to invoke before server startup
    shutdown-on-keypress-enter = false
    shutdown-on-bind-failed    = true
    # ssl.enabled              = false            # Optional, defaults to app.server.ssl-config is configured
    # ssl-config {                                # Optional, falls back to ssl-config. See https://github.com/lightbend/ssl-config
    # }
  }

  template {
    engine   = org.wabase.DefaultWabaseTemplate
    loader   = org.wabase.DefaultWabaseTemplateLoader
    renderer = org.wabase.MustacheTemplateRenderer
  }

  # override this setting with HttpCookie => HttpCookie function if you want to modify XSRF-TOKEN cookie
  csrf.cookie-transformer = null

  use-serialized-result-blocking-transformer    = false             # for result serializer debugging

  # connection from this pool will be used if view property explicit db = true and db connection is not available (i.e. no db use or transaction block)
  wabase.evaluator.pool = _evaluator_

  crud-redirects-prefix = ""                      # set to "/data/" for legacy applications
  resource-path-base = app
  resource-extensions = [js, css, html, png, gif, jpg, jpeg, svg, woff, ttf, woff2]

  state-cookie-prefix = current_
  language-cookie-postfix = lang
  names-for-int-params = [limit, offset]

  function-invocation-cache-size = 4096

  marshal_key_as_json = true

  wabase-call-alias {
    #audit handler
    audit                                   = org.wabase.audit.Audit.handleAuditing
    # csrf defence handlers
    checkCsrfToken                          = org.wabase.handlers.CSRFHandlers.checkCsrfToken
    checkSameOrigin                         = org.wabase.handlers.CSRFHandlers.checkSameOriginForRequest
    deleteCsrfCookie                        = org.wabase.handlers.CSRFHandlers.deleteCsrfCookie
    setCsrfCookie                           = org.wabase.handlers.CSRFHandlers.setCsrfCookie
    # i18n handlers
    i18nResources                           = org.wabase.handlers.I18nHandlers.i18nResources
    i18nResourcesFromBundle                 = org.wabase.handlers.I18nHandlers.i18nResourcesFromBundle
    i18nTranslate                           = org.wabase.handlers.I18nHandlers.i18nTranslate
    setLanguage                             = org.wabase.handlers.I18nHandlers.setLanguage
    # metadata handlers
    api                                     = org.wabase.handlers.MetadataHandlers.api
    metadata                                = org.wabase.handlers.MetadataHandlers.metadata
    swaggerJson                             = org.wabase.handlers.MetadataHandlers.generateSwaggerJson
    swaggerYaml                             = org.wabase.handlers.MetadataHandlers.generateSwaggerYaml
    # action handlers
    doAction                                = org.wabase.handlers.ActionHandlers.doActionWithKeyToPath
    doRequest                               = org.wabase.handlers.ActionHandlers.doRequest
    startJob                                = org.wabase.handlers.ActionHandlers.startJob
    #authentication handlers
    authenticate                            = org.wabase.handlers.AuthenticationHandlers.authenticatePlusSession
    authenticateOpt                         = org.wabase.handlers.AuthenticationHandlers.authenticatePlusSessionOpt
    authenticateDomainAndPath               = org.wabase.handlers.AuthenticationHandlers.authenticateDomainAndPathPlusSession
    authenticateDomainAndPathOpt            = org.wabase.handlers.AuthenticationHandlers.authenticateDomainAndPathPlusSessionOpt
    setSessionCookie                        = org.wabase.handlers.AuthenticationHandlers.setAppSessionCookie
    setSessionCookieOpt                     = org.wabase.handlers.AuthenticationHandlers.setAppSessionCookieOpt
    setDomainAndPathSessionCookie           = org.wabase.handlers.AuthenticationHandlers.setDomainAndPathSessionCookie
    setDomainAndPathSessionCookieOpt        = org.wabase.handlers.AuthenticationHandlers.setDomainAndPathSessionCookieOpt
    removeSessionCookie                     = org.wabase.handlers.AuthenticationHandlers.removeAppSessionCookie
    extractBasicHttpCredentials             = org.wabase.handlers.AuthenticationHandlers.extractBasicHttpCredentials
    extractFormDataCredentials              = org.wabase.handlers.AuthenticationHandlers.extractFormDataCredentials
    extractJwtTokenCredentials              = org.wabase.handlers.AuthenticationHandlers.extractJwtTokenCredentials
    checkRole                               = org.wabase.handlers.AuthenticationHandlers.checkRole
    setAnonSessionCookie                    = org.wabase.handlers.AuthenticationHandlers.setAnonSessionCookie
    # deferred handlers
    doDeferred                              = org.wabase.handlers.DeferredHandlers.doDeferred
    maybeDeferred                           = org.wabase.handlers.DeferredHandlers.maybeDeferred
    deferredResult                          = org.wabase.handlers.DeferredHandlers.deferredResult
    # file handlers
    fileUpload                              = org.wabase.handlers.FileHandlers.fileUpload
    fileUploadUsing                         = org.wabase.handlers.FileHandlers.fileUploadUsing
    fileDownload                            = org.wabase.handlers.FileHandlers.fileDownload
    fileDownloadUsing                       = org.wabase.handlers.FileHandlers.fileDownloadUsing
    doFileCleanup                           = org.wabase.FileCleanup.doCleanup
    # event notification handlers
    subscribeToServerSentEvents             = org.wabase.handlers.EventNotificationsHandlers.subscribeToServerSentEvents
    subscribeToWebSocketMessages            = org.wabase.handlers.EventNotificationsHandlers.subscribeToWebSocketMessages
    # request handlers
    extractState                            = org.wabase.handlers.RequestHandlers.extractState # current_xxx -> value cookie pair map extraction from request
    keyFromQueryToPath                      = org.wabase.handlers.RequestHandlers.keyFromQueryToPath
    # response handlers
    ok                                      = org.wabase.handlers.ResponseHandlers.okResponse
    response                                = org.wabase.handlers.ResponseHandlers.statusAndTextResponse
    responseWithContentType                 = org.wabase.handlers.ResponseHandlers.responseWithContentType
    status                                  = org.wabase.handlers.ResponseHandlers.statusResponse
    getFromResource                         = org.wabase.handlers.ResponseHandlers.getFromResource
    # miscellaneous
    buildCookieHeaderValue                  = org.wabase.AppQuerease.buildCookieHeaderValue
    sleep                                   = org.wabase.AppQuerease.sleep
    startJobAction                          = org.wabase.AppQuerease.startJob
    toHierarchy                             = org.wabase.AppQuerease.toHierarchy
    publishEvent                            = org.wabase.ServerNotifications.publishEvent
  }

  wabase-authorization {
    class = null # like org.wabase.DefaultWabaseAuthorization
    # view name must have get action and return boolean value.
    # WabaseUser attributes are passed under config parameter app.current-user-key-name value
    # Roles to be checked are passed as a collection in 'roles' parameter.
    view = null
  }
  wabase-injection-parameters-provider-factory = org.wabase.AppQuerease.InjectionParametersProviderFactory

  wabase-error-handler = org.wabase.WabaseErrorHandler.errorHandler
  # this can be used for example for error auditing purposes
  wabase-error-handler-and-then = null            # WabaseRequestContext => HttpResponse => Future[HttpResponse]

  server-notifications {
    enabled = true
    event-function = org.wabase.ServerNotifications.createServerEvent
    event-subscriber-watcher-actor-name = WabaseEventSubscriberWatcherActor
  }

  script-validations {
    enabled = false
    init = org.wabase.WabaseScriptValidation.initWabaseScriptValidation
    script-engine-factory = org.wabase.WabaseScriptValidation.scriptEngineFactory
    script-engine-init = org.wabase.WabaseScriptValidation.initScriptEngine
    custom-functions-init = org.wabase.WabaseScriptValidation.customFunctions
    load-validations = org.wabase.WabaseScriptValidation.loadValidations
  }

  # Writer => PartialFunction[Any, Writer]
  json-encoder-customization = null

  # override this value for performance or other considerations
  # default implementation creates logger with name components corresponding http uri path segments
  wabase-logger-name-factory = org.wabase.LoggerNameFactory
  wabase-swagger-generator-factory = org.wabase.WabaseSwaggerGeneratorFactory
}

auth.crypto.key = null                            # use org.wabase.Authentication.Crypto.newKey to generate
auth.mac.key    = null                            # use org.wabase.Authentication.Crypto.newKey to generate

component-conf.conf-loader-class = null           # Optional. Alternative component configuration loader class

data-parsers-csv {
  factory-class       = org.wabase.CsvDecoderFactory
  delimiter           = ","
  quote-char          = "\""
  escape-char         = "\\"
  charset             = UTF-8
  maximum-line-length = 8192
  default_csv_decoder {                           # put object(s) in your conf for more parsers; props are inherited
    # headers         = ["col1", "col2"]          # Optional. Column names if no header row is expected
  }
}

data-parsers-json {
  factory-class       = org.wabase.JsonDecoderFactory
  max-object-size     = 1048576
  default_json_decoder {                          # put object(s) in your conf for more parsers; props are inherited
  }
}

data-parsers-xml {
  factory-class       = org.wabase.XmlDecoderFactory
  # default_xml_decoder {                         # put object(s) in your conf for xml parsers; props are inherited
  #   path            = ["doc", "elem"]           # Path to match records to be extracted
  # }
}

file-streamer {
  # cp                  = # optional
  factory-class         = org.wabase.FileStreamerFactory
  files.path            = ${app.files.path}
  file-info-table       = file_info
  file-body-info-table  = file_body_info
  sha-col-name          = sha_256
  #main {                                         # put object(s) in your conf to enable filestreamer(s); props are inherited
  #}
}

http-client {
  factory-class         = org.wabase.client.HttpClientFactory
  client-class          = org.wabase.client.RestClient
  server-port           = 8080
  server-path           = "http://localhost:"${http-client.server-port}"/"
  server-ws-path        = "ws://localhost:"${http-client.server-port}"/ws"
  request-timeout       = 5 s
  # await-timeout       # Optional. Defaults to request-timeout + 2 seconds. Should be bigger than request-timeout for useful error messages
  ssl-config = ${ssl-config} # Optional. See https://github.com/lightbend/ssl-config
  # main {              # put object(s) in your conf to enable http client(s); props are inherited
  # }
}

# function takes typesafe config as argument which comes from jdbc.cp.<db name>
jdbc.data-source-factory = org.wabase.ds.HikariDs.create

# JDBC connection pools, see https://github.com/brettwooldridge/HikariCP
jdbc.cp {
  #main {
  #  poolName   = main-cp
  #  jdbcUrl    = null # "jdbc:postgresql://localhost:5432/db"
  #  username   = null
  #  password   = null
  #  autoCommit = false
  #}
}
jdbc.query-timeout      = 5 s

jwt-decoder {
  # Claim name mappings from RFC 7519 short names to English identifiers in underscore style
  claim-mappings {
    iss = "issuer"
    sub = "subject"
    aud = "audience"
    exp = "expiration_time"
    nbf = "not_before"
    iat = "issued_at"
    jti = "jwt_id"
  }

  # Clock configuration for java.time.Clock
  clock {
    time-zone = "UTC"
    # Optional fixed instant for testing (uncomment to use a fixed clock)
    # fixed-instant = "2023-01-01T00:00:00Z"
  }

  # JWT options from jwt-scala, with boolean keys prefixed with 'validate-'
  options {
    validate-signature  = true   # Whether to validate the JWT signature
    validate-expiration = true   # Whether to validate the expiration time (exp)
    validate-not-before = true   # Whether to validate the not-before time (nbf)
    leeway = 0                   # Clock skew tolerance in seconds
  }

  # Keys for decoding the JWT (provide either a secret key for HMAC or a public key for RSA/ECDSA)
  key-loader-class = org.wabase.KeyLoader # Key loader for "keys.secret-key" and/or "keys.public-key" loading from config value or subconfig
  keys {                                  # See KeyLoader documentation for supported key formats and parameters
    secret-key = "your-secret-key-here"   # Secret (symmetric) key if HMAC algorithms (e.g., HS256) are allowed - PKCS12, BASE64 or HEX
    public-key = "your-public-key-here"   # Public key if RSA/ECDSA algorithms (e.g., RS256) are allowed        - PKCS12, PEM or DER
  }

  # List of allowed signing algorithms. See jwt-scala documentation for supported algorithms
  allowed-algorithms = [RS256, RS384, RS512]

  accept {
    # Acceptable issuer (checked against the 'iss' claim)
    issuer = "your-expected-issuer"      # Omit or set to null to skip issuer check

    # Acceptable audience (checked against the 'aud' claim if specified)
    audience = "your-expected-audience"  # Omit or set to null to skip audience check
  }
}

# if action call stack depth or posted structure nesting depth exceeds parameter value IllegalStateException is thrown
wabase.max-stack-depth = 50

result-renderers.factory-class = org.wabase.ResultRenderersFactory
request-decoders.factory-class = org.wabase.RequestDecodersFactory

session.cookie.name     = "session-id"
session.cookie.path     = "/"
session.cookie.secure   = false
session.timeout         = 900s

tresql {
  max-result-size  = 10000
  cache-size       = 4096
  dialect-factory  = org.wabase.TresqlResourcesConf.vendor_dialect
  id-expr-factory  = org.wabase.TresqlResourcesConf.vendor_id_expr
}
