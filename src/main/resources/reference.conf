######################################
#    Wabase Reference Config File    #
######################################
app {
  home = "/home/my-wabase-app"
  files.path = ${app.home}/files
  file-cleanup.jdbc.query-timeout = ${jdbc.query-timeout}
  current-user-key-name = current_user
  user-credentials-key-name = credentials

  audit-queue.path = ${app.home}/audit-queue      # this path must NOT be on network or temp and must NOT be shared.
  host = null                                     # "http://127.0.0.1"
  upload.size-limit       = 8 m
  db-data-file-max-size   = 8 m
  db-data-file-max-sizes {
    # name = 2 m
  }
  deferred-requests {
    worker-count          = 2                     # ensure there are connections left in pool for other tasks, too!
    default-timeout       = 180 s
    cleanup-job-interval  = 1800 s
    # requests = """
    #   my_slow_1
    #   my_slow_n
    # """
    requests = """
    """
    timeouts {
      # my_slow_1 = 60s
    }
    modules {
      # module_1.worker-count = 2
      # module_2.worker-count = 5
    }
    storage {
      # cp                  = # optional
      file-streamer {
        # cp                  = # optional
        files.path            = ${app.home}/files-for-deferred
        file-info-table       = deferred_file_info
        file-body-info-table  = deferred_file_body_info
        sha-col-name          = sha_256
        jdbc.query-timeout    = ${jdbc.query-timeout}
      }
    }
    factory-class         = org.wabase.WabaseDeferredControl
    storage-factory-class = org.wabase.DbDeferredStorageFactory
  }
  field-filter-parameter-name = "fields"          # parameter name in uri query to filter result fields for 'list', 'get' and 'create' actions, may be null
  serialization-buffer-size   = 32 k

  email {
    enabled  = true
    sender   = org.wabase.DefaultWabaseEmailSender
  }

  job {
    actor    = org.wabase.WabaseJobActor
    max-time = "1 hour"                           # interval in db format - when is it safe to restart job if lock is not released
    job-status-cp = "main"                        # connection pool for cron_job_status table
  }

  public-api {
    role-name        = "public"                   # pseudo-role to allow access to view api without user and role check
  }
  public-views {
    location-pattern = "^public/.*\\.yaml$"       # path/and/filename pattern to allow access to view api without user and role check
  }

  server {
    shutdown-on-keypress-enter = false
    shutdown-on-bind-failed    = true
  }

  template {
    engine   = org.wabase.DefaultWabaseTemplate
    loader   = org.wabase.DefaultWabaseTemplateLoader
    renderer = org.wabase.MustacheTemplateRenderer
  }

  use-serialized-result-blocking-transformer    = false             # for result serializer debugging

  # connection from this pool will be used if view property explicit db = true and db connection is not available (i.e. no db use or transaction block)
  wabase.evaluator.pool = _evaluator_

  rest-path-base = data
  resource-path-base = app
  resource-extensions = [js, css, html, png, gif, jpg, jpeg, svg, woff, ttf, woff2]

  state-cookie-prefix = current_
  language-cookie-postfix = lang
  i18n-path-prefix = i18n
  names-for-int-params = [limit, offset]

  function-invocation-cache-size = 4096

  wabase-call-alias {
    extractState                = org.wabase.ApplicationStateExtractor.extractState
    buildCookieHeaderValue      = org.wabase.AppQuerease.buildCookieHeaderValue
    resultWithQuereaseResources = org.wabase.AppQuerease.resultWithQuereaseResources
    requestPartsToBindableMap   = org.wabase.AppQuerease.requestPartsToBindableMap
    doAction                    = org.wabase.WabaseService.doAction
    doRequest                   = org.wabase.WabaseService.doRequest
    keyFromQueryToPath          = org.wabase.WabaseService.keyFromQueryToPath
    authenticate                = org.wabase.WabaseAuthentication.appAuthenticate
    setSessionCookie            = org.wabase.WabaseAuthentication.setAppSessionCookie
    removeSessionCookie         = org.wabase.WabaseAuthentication.removeAppSessionCookie
    extractBasicHttpCredentials = org.wabase.WabaseAuthentication.extractBasicHttpCredentials
    extractJwtTokenCredentials  = org.wabase.WabaseAuthentication.extractJwtTokenCredentials
  }

  wabase-authorization-factory = org.wabase.Authorization
  wabase-injection-parameters-provider-factory = org.wabase.AppQuerease.InjectionParametersProviderFactory

  wabase-error-handler = org.wabase.WabaseErrorHandler.errorHandler
}

auth.crypto.key = null                            # use org.wabase.Authentication.Crypto.newKey to generate
auth.mac.key    = null                            # use org.wabase.Authentication.Crypto.newKey to generate

component-conf.conf-loader-class = null           # Optional. Alternative component configuration loader class

data-parsers-csv {
  factory-class       = org.wabase.CsvDecoderFactory
  delimiter           = ","
  quote-char          = "\""
  escape-char         = "\\"
  charset             = UTF-8
  maximum-line-length = 8192
  default_csv_decoder {                           # put object(s) in your conf for more parsers; props are inherited
    # headers         = ["col1", "col2"]          # Optional. Column names if no header row is expected
  }
}

data-parsers-xml {
  factory-class       = org.wabase.XmlDecoderFactory
  # default_xml_decoder {                         # put object(s) in your conf for xml parsers; props are inherited
  #   path            = ["doc", "elem"]           # Path to match records to be extracted
  # }
}

file-streamer {
  # cp                  = # optional
  factory-class         = org.wabase.FileStreamerFactory
  files.path            = ${app.files.path}
  file-info-table       = file_info
  file-body-info-table  = file_body_info
  sha-col-name          = sha_256
  jdbc.query-timeout    = ${jdbc.query-timeout}
  #main {                                         # put object(s) in your conf to enable filestreamer(s); props are inherited
  #}
}

http-client {
  factory-class         = org.wabase.client.HttpClientFactory
  client-class          = org.wabase.client.RestClient
  actor-system-name     = rest-client
  server-port           = 8080
  server-path           = "http://localhost:"${http-client.server-port}"/"
  server-ws-path        = "ws://localhost:"${http-client.server-port}"/ws"
  request-timeout       = 5 s
  # await-timeout       # Optional. Defaults to request-timeout + 2 seconds. Should be bigger than request-timeout for useful error messages
  # ssl-config {        # Optional. See https://github.com/lightbend/ssl-config
  # }
  # main {              # put object(s) in your conf to enable http client(s); props are inherited
  # }
}

# JDBC connection pools, see https://github.com/brettwooldridge/HikariCP
jdbc.cp {
  #main {
  #  poolName   = main-cp
  #  jdbcUrl    = null # "jdbc:postgresql://localhost:5432/db"
  #  username   = null
  #  password   = null
  #  autoCommit = false
  #}
}
jdbc.query-timeout      = 5 s

jwt-decoder {
  # Claim name mappings from RFC 7519 short names to English identifiers in underscore style
  claim-mappings {
    iss = "issuer"
    sub = "subject"
    aud = "audience"
    exp = "expiration_time"
    nbf = "not_before"
    iat = "issued_at"
    jti = "jwt_id"
  }

  # Clock configuration for java.time.Clock
  clock {
    time-zone = "UTC"
    # Optional fixed instant for testing (uncomment to use a fixed clock)
    # fixed-instant = "2023-01-01T00:00:00Z"
  }

  # JWT options from jwt-scala, with boolean keys prefixed with 'validate-'
  options {
    validate-signature  = true   # Whether to validate the JWT signature
    validate-expiration = true   # Whether to validate the expiration time (exp)
    validate-not-before = true   # Whether to validate the not-before time (nbf)
    leeway = 0                   # Clock skew tolerance in seconds
  }

  # Keys for decoding the JWT (provide either a secret key for HMAC or a public key for RSA/ECDSA)
  key-loader-class = org.wabase.KeyLoader # Key loader for "keys.secret-key" and/or "keys.public-key" loading from config value or subconfig
  keys {                                  # See KeyLoader documentation for supported key formats and parameters
    secret-key = "your-secret-key-here"   # Secret (symmetric) key if HMAC algorithms (e.g., HS256) are allowed - PKCS12, BASE64 or HEX
    public-key = "your-public-key-here"   # Public key if RSA/ECDSA algorithms (e.g., RS256) are allowed        - PKCS12, PEM or DER
  }

  # List of allowed signing algorithms. See jwt-scala documentation for supported algorithms
  allowed-algorithms = [RS256, RS384, RS512]

  accept {
    # Acceptable issuer (checked against the 'iss' claim)
    issuer = "your-expected-issuer"      # Omit or set to null to skip issuer check

    # Acceptable audience (checked against the 'aud' claim if specified)
    audience = "your-expected-audience"  # Omit or set to null to skip audience check
  }
}

result-renderers.factory-class = org.wabase.ResultRenderersFactory
request-decoders.factory-class = org.wabase.RequestDecodersFactory

session.cookie.name     = "session-id"
session.cookie.secure   = false
session.timeout         = 900s
tresql.max-result-size  = 10000
tresql.cache-size       = 4096
