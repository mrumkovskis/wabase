table:    cron_job_status
comments: Automatic process status control
columns:
- job_name            ! 60
- stats_since         ! dateTime
- status              ! (running, success, error)
- start_count         ! long = 0
- success_count       ! long = 0
- error_count         ! long = 0
- collision_count     ! long = 0
- last_run_status       (success, error)
- last_start_time       dateTime
- last_success_time     dateTime
- last_success_details
- last_error_time       dateTime
- last_error_details
pk:
- job_name


table:    cron_job_history
comments: Job run history
columns:
- uuid                ! 36
- job_name            ! 60
- start_time          ! dateTime
- end_time              dateTime
- status              ! (running, success, error)
- details
pk:
- uuid
idx:
- start_time
- job_name, start_time


table:    cron_job_queue
comments: Waiting job runs shared by all nodes. params is a Java object serialization.
columns:
- id                  ! long
- job_name            ! 60
- params              ! bytes
- enqueued_time       ! dateTime
pk:
- id
idx:
- job_name, id


table:    cron_job_queue_seq
comments: One row (id = 1). next_id allocates cron_job_queue ids. Updating the row locks queue changes.
columns:
- id                  ! int = 1
- next_id             ! long = 0
pk:
- id
