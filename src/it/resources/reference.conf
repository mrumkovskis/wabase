app {
  home = /tmp/wabase-test
  host = "http://127.0.0.1"
  public-api {
    views-location-pattern = "(?!(roles-test)).*\\.yaml"  # path/and/filename pattern to allow access to view api without user and role check
    views-uri-prefix = "/data"
  }
  deferred-requests.requests = [slow-respond]
  wabase-call-alias {
    businessError = wabase.app.BusinessScenariosSpecs.businessError
    sleepAndRespond = wabase.app.BusinessScenariosSpecs.sleep
    generateSwaggerJsonForRedirects = wabase.app.SwaggerTests.generateSwaggerJsonForRedirects
  }
  script-validations {
    enabled = true
    init = org.wabase.WabaseScriptValidation.initWabaseScriptValidation
    script-engine-factory = org.wabase.WabaseScriptValidation.scriptEngineFactory
    script-engine-init = org.wabase.WabaseScriptValidation.initScriptEngine
    custom-functions-init = org.wabase.WabaseScriptValidation.customFunctions
    load-validations = wabase.app.ScriptValidations.loadValidations
  }
  job {
    scheduler-initializer = org.wabase.scheduler.QuartzScheduler.init
    job-status-cp = "wabase_it_cp"
    clean-jobs-on-start = false
  }

  template {
    renderer = org.wabase.MustacheAndPdfTemplateRenderer
  }

  query-parameters-decoder = wabase.app.BusinessScenariosSpecs.queryParamsDecoder

  csrf.cookie-transformer = wabase.app.BusinessScenariosSpecs.identityCsrfCookieTransformer

  wabase-authorization.view = has_role

  wabase-extra-metadata {
    loader = wabase.app.ExtraMetadata.load
    # filesystem dirs, relative to forked test jvm working dir (src/it) - like TemplateUtil.resourcePath
    paths  = [ resources/extra-metadata ]
  }
}
port = 8080

auth.crypto.key = 3nkJyrxU9q4tx5nGmH7Ns2DRML9EP6gZF8DvE0DKN2I
auth.mac.key    = SGXimqa4IGf7dIkOXQSpwhGTBZgWyBoaLErPgpF297w

tresql {
  default = wabase_it_cp
}

http-client.main {}

file-streamer.main {}                                        # enable file streamer

jdbc.cp {
  wabase_it_cp {
    poolName = wabase_it_cp
    jdbcUrl  = "jdbc:hsqldb:mem:mymemdb"
    username = "SA"
    password = ""
    autoCommit = false
    maximumPoolSize = 2
  }
  audit_write {
    poolName = audit_write
    jdbcUrl  = "jdbc:hsqldb:mem:mymemdb"
    username = "SA"
    password = ""
    autoCommit = false
    maximumPoolSize = 1
  }
}

# Email is sent to in-process greenmail smtp server started by BusinessScenariosSpecs.
# Inbox is examined through /backdoor/inbox, cleared by /backdoor/purge-inbox.
simplejavamail {
  transportstrategy = SMTP
  opportunistic.tls = false                                  # greenmail smtp does not offer starttls
  smtp {
    host = "127.0.0.1"
    port = 3125
  }
}
