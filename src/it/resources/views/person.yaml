name:   person
table:  person
api:    count, new, get, list, upsert, delete
key:    code
fields:
- code
- name
- surname
order:
- code


# 303 redirect this — used by person-redirect-key-in-path ITs
name:   person_redirect
table:  person
api:    get, upsert, update+
key:    code
fields:
- code
- name
- surname
upsert:
- upsert this
- redirect this
update+:
- update this
- redirect this


# also available on localized-data route to test localized error handler, see i18n it tests
name:   save_person_email
paths:
  - /data/save_person_email
  - /localized-data/save_person_email
table:  person
api:    save
key:    code
fields:
- code
- email
swagger:                                                # test only paths, skip swagger
  /localized-data/save_person_email = :        null
  /localized-data/save_person_email/{code} = : null
