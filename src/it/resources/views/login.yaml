name:   login_using_json_or_urlencoded
api:    insert
fields:
- name
- password
insert:
- if exists(user[name = :current_user.credentials.name] {id}) :
  - user_id = user[name = :current_user.credentials.name] {id}
  - stored_password_hash = user[id = :user_id] {password}
  - org.wabase.Authentication.checkPassword(:current_user.credentials.password, :stored_password_hash)
  - roles   = [user_role[user_id = :user_id] {role}]
  - (status ok
      user_attrs({'id', :user_id})
      user_attrs({'name', :current_user.credentials.name})
      user_attrs({'roles', |:'roles'})
    )
- else:
  - status 401
