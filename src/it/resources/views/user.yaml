fields:
- user_id
- role:
  swagger:
    example: admin


name:     current_user
api:      get
fields:
- user_id
- name
- roles *
get:
  # unique { :current_user.id user_id, :current_user.name name, |:'current_user'.'roles' roles }
  - return (user_id = :current_user.id) + :current_user
swagger:
  paths = : {}  # Served from dedicated path, do not add to api as view
