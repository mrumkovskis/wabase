name: user-with-roles-array
api: get
fields:
get:
- as any unique {'jasmine' name, |[({'admin'} + {'guest'})#(1)] 'roles'}


name:     user
table:    user
api:      get, save
fields:
- id
- name
- password:
    swagger:
      example: password


name:     user_role
table:    user_role
