name:   try_recover_ok
paths:  /try-recover/try_recover_ok
api:    public list
list:                             # recover step is skipped if no exception is thrown
- as any 'no failure'
- recover:
  - as any 'from recover'


# Same swagger shape as try_recover_ok, no overrides — keep only the first in swagger.
name:   try_recover_recovers
paths:  /try-recover/try_recover_recovers
api:    public list
list:                             # recover step handles failure of preceding steps
- error 'deliberate failure'
- recover:
  - as any 'from recover'
swagger:
  paths = : {}


name:   try_recover_error_data
paths:  /try-recover/try_recover_error_data
api:    public list
list:                             # exception data is available to recover step action
- error 'deliberate failure'
- recover:
  - as any :wabase_error.errors
swagger:
  paths = : {}


name:   try_recover_rethrow
paths:  /try-recover/try_recover_rethrow
api:    public list
list:                             # exception rethrown from recover step action is not handled again
- businessError 'rethrown failure'
- recover:
  - rethrow
swagger:
  paths = : {}


name:   try_recover_no_recover
paths:  /try-recover/try_recover_no_recover
api:    public list
list:                             # no recover step - exception must propagate
- error 'unhandled failure'
swagger:
  paths = : {}


name:   try_recover_nested
paths:  /try-recover/try_recover_nested
api:    public list
list:                             # block has recover step of its own, so failure does not reach
                                  # recover step of enclosing block
- db use:
  - error 'inner failure'
  - recover:
    - as any 'from inner recover'
- recover:
  - as any 'from outer recover'
swagger:
  paths = : {}


name:   try_recover_oneliner
paths:  /try-recover/try_recover_oneliner
api:    public list
list:                             # one step recover, equivalent of recover block with single step
- error 'deliberate failure'
- recover as any 'from one step recover'
swagger:
  paths = : {}


name:   try_recover_in_recover
paths:  /try-recover/try_recover_in_recover
api:    public list
list:                             # recover step nested in recover step action
- error 'outer failure'
- recover:
  - error 'inner failure'
  - recover:
    - as any 'from recover in recover'
swagger:
  paths = : {}


name:   try_recover_continues
paths:  /try-recover/try_recover_continues
api:    public list
list:                             # execution continues with steps following recover step,
                                  # recover step action sees scope of the failed step
- x = 'before'
- error 'deliberate failure'
- recover:
  - y = :x || '-recovered'
- z = :y || '-after'
- as any :z
swagger:
  paths = : {}


# steps of guarded region must be rolled back to savepoint before recover step action,
# recover step action must be able to access database after failed step
name:   try_recover_savepoint
paths:  /try-recover/try_recover_savepoint
api:    public list
list:
- +try_recover{code = 'in-try', value = 'try value'}
- error 'fail after insert'
- recover:
  - +try_recover{code = 'in-recover', value = 'recover value'}
- as any try_recover{code, value}#(1)
swagger:
  paths = : {}
