name: msg_it_send
api: post
decoder: none
key: topic
fields:
- topic
- value
post:
- msg send to=:topic (:value)
- status 202


name: msg_it_events
api: get
key: topic
fields:
- topic
- group
- last
get:   # server sent events of message values, committed, until message with value last (continuous - value not sent)
- foreach msg read group=:group from=:topic committer=true to={:value = coalesce(:'..'.last, '')}:  # coalesce - typed parameter for hsqldb
  - :value


name: msg_it_offsets
api: get
key: topic
fields:      # group - parameter, other fields - result columns
- topic
- group
- group_id
- partition int
- offset    long
- metadata
get:
- msg committed offsets {:group group_id, :topic topic, 0 partition}


name: msg_it_multi_send
job:   # no api - not in api / metadata snapshots, started with POST /start-job/msg_it_multi_send
# fan-out of messaging source - destination filter, destination operation, committed after all destinations
- msg multi send:
  - msg read group='msg_it_multi' from='msg_it_orders' committer=true to={:value = 'end'}
  - to:
    - msg send to='msg_it_eu' filter={:value ~ 'eu%'}
    - msg send to='msg_it_marked' (:value || '!')
# msg send filter - forwarded messages filtered, all committed
- msg send to='msg_it_us' filter={:value ~ 'us%' | :value = 'end'}
    msg read group='msg_it_filter' from='msg_it_orders' committer=true to={:value = 'end'}
# rows source, destination operation on action's connection
- msg multi send:
  - ({1 id} ++ {2 id})
  - to:
    - msg send to='msg_it_rows' ('r' || :id)
