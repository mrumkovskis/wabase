on: GET /hello
do: response(200, 'Hello from wabase!')
swagger:
  '200':
    content:
      text/plain:
        type: string


on: /hello
do: status(405)   # Method Not Allowed
swagger:
  paths = : {}    # No need for apidoc if not allowed


on: GET /hello_json
do: responseWithContentType(200, 'application/json', '"Hello from wabase!"')
swagger:
  '200':
    content:
      application/json:
        type: string
