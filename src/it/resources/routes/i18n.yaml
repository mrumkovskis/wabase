on: GET /i18n
do: extractState i18nResources
swagger:
  '200':
    content:
      application/json:
        type: array
        items:
          type: object


on: GET /i18n/(?<key>[^/]+)(?:/(?<parameters>.*))?
do: extractState i18nTranslate('wabase', $1, $2)
swagger:
  '200':
    content:
      text/plain: {}


on: GET /i18n-bundle/(\w+)
do: extractState i18nResourcesFromBundle $1
swagger:
  '200':
    content:
      application/json:
        type: array
        items:
          type: object


on: POST /set-language/(\w+)
do: setLanguage($1) ok
swagger:
  responses = :
    '200': {}
