on: GET /deferred-result/{deferred_id}
do: authenticateOpt deferredResult($deferred_id)


on: GET /slow-respond
do: authenticateOpt maybeDeferred sleepAndRespond(500) response(200, 'slow done')
swagger:
  '200':
    content:
      text/plain:
        type: string


on: GET /fast-respond
do: authenticateOpt maybeDeferred sleepAndRespond(005) response(200, 'fast done')
swagger:
  '200':
    content:
      text/plain:
        type: string
