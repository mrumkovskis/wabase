should: Array with items
paths:
  /user-with-roles-array:
    get: {}
overrides:
  get:
    summary: Get user with roles
    responses:
      "200":
        content:
          application/json:
            type: object
            properties:
              roles:
                type: array
                items: string
                example: [admin, guest]
              name:
                type: string
                example: John
    description: Returns user info
expected:
  /user-with-roles-array:
    get:
      summary: Get user with roles
      description: Returns user info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: string
                    example: [admin, guest]
                  name:
                    type: string
                    example: John
