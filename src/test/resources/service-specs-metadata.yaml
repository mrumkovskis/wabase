#################### routes ################

on:       /simple
do:       simpleHandler

on:       /no-param-handler
do:       noParamHandler

on:       /uri
do:       urlTransformer uriValue

on:       GET /method-dependent-path      # http method GET + path match
do:       methodAndPathMatch

on:       POST PUT /method-dependent-path  # http method POST PUT + path match
do:       methodAndPathMatch

on:       POST PUT /decoded-map-entity
do:       decodedMapEntity

on:       POST PUT /decoded-seq-entity
do:       decodedSeqEntity

on:       POST PUT /decoded-string-entity
do:       decodedStringEntity

on:       POST PUT /decoded-dto-entity
do:       decodedDtoEntity

on:       /method-dependent-path
do:       methodAndPath

on:       /non-ascii-uri/glāžšķūņu rūķīši
do:       urlTransformer uriValue

on:       /response-transformer
do:       urlTransformer responseTransformer uriValue

on:       /echo
do:       echo

on:       /handler-transformer
do:       transformer echo

on:       /user
do:       testAuth respondWithUserName

on:       /user-info
do:       testAuth org.wabase.WabaseAuthentication.userPrincipal

on:       /long-handler-chain
do:       testAuth urlTransformer responseTransformer addUserData uriValue

on:       /greater/than-3/(\w+)
do:       keyExtractor keyChecker
recover:  testErrorHandler

on:       /(key_in_action)(.*)
do:       doAction $1
recover:  testErrorHandler

# for dynamic route handler matching path first group must match handler name
on:       /do/([\w\.]+).*
do:       doRequest $1

# for view matching path first group must match [(create|count):]<view_name> (WabaseService.viewActionKey transformer)
on:       /public/([\w:]+)(.*)
do:       authenticateOpt doAction $1

on:       /(login)
do:       extractBasicHttpCredentials setSessionCookie doAction $1

on:       /restricted/(?<viewname>[\w:]+)(.*)
do:       authenticate doAction $1

on:       /(user_data_merge)
do:       testAuth mergeUserData doAction $1

# route with additional parameters - string constant, url matched group (numbering starts with 1)
on:       /static_resources/(.*\.txt)?
do:       staticResources('static_resources', $1)

# deep nested structure decoding for view
on:       POST PUT /deep-nested-view/(.+)
do:       org.wabase.WabaseService.viewActionKey($1) org.wabase.WabaseService.toMapForViewEntityDecoder

on:       POST PUT /deep-nested-data
do:       org.wabase.WabaseService.toMapEntityDecoder

# default error processing
on:       /error
do:       org.wabase.WabaseTestHandlers.error

# head method test
on:       GET HEAD /(head)
do:       doAction $1

################# views ###############

name: view1
api: get, insert, update, delete, list, create, count
explicit db: true
key: id
fields:
- id
- value
get:
- value = 'Value' || :id
insert:
- this
update:
- value = 'upd-' || :value
- this
delete:
- "'deleted ' || :id"
list:
- null {'"' || :list_filter_param || '"'}     # escape syntax due to yaml parser - '"' || :list_filter_param || '"' does not work
create:
- null {"[" || :p1 || ', "' || :p2 || '"]'}
count:
  - 1


name: login
api: get
explicit db: true
get:
- roles = [({trim('guest')} + {trim('admin')} + {trim('operator')})#(1)]      # trim values for hsqldb to avoid space padding
- if :current_user.credentials.username = 'Gunza' & :current_user.credentials.password = 'good'
    (status ok
       user_attrs({'id', 10})
       user_attrs({'roles', |:'roles'})
       'ok'
    )
  else status 401


name: user_principal
api: get, insert
decoder: none
explicit db: true
get:
- as any :current_user
insert:
- status ok currentUser


name: user_data_merge
api: get
explicit db: true
get:
- status ok
    user_attrs({'password', null} /*remove attribute*/)
    user_attrs({'session_id', 'abcdefgh'})
    user_attrs({'roles', |[({trim('guest')} + {trim('admin')} + {trim('operator')})#(1)]} /*array query as child*/)


name: nested_view
api: insert, update
explicit db: true
fields:
- code int
- children * nested_view


name: querease_action_exception
api: get, insert, update
explicit db: true
decoder: none
get:
- org.wabase.WabaseTestHandlers.error
insert:
- org.wabase.WabaseTestHandlers.authError
update:
- org.wabase.WabaseTestHandlers.csrfException


name: key_in_action
api: get
explicit db: true
get:
- org.wabase.WabaseTestHandlers.keyInAction :code


name: entity_size_limit
api: insert
decoder: default 64b
explicit db: true
fields:
- id
- name
insert:
- this


name: state_extractor
api: get
explicit db: true
fields:
get:
- as any unique_opt { if_defined_or_else(:current_name?, :current_name, null) name,
    if_defined_or_else(:current_dept?, :current_dept, null) dept }


name: head
api: head, get
explicit db: true
head:
- response ok set_headers({'Last-Modified', 'Mon, 29 Sep 2025 22:18:54 EET'})
get:
- extract header Last-Modified http head {'/head'}
