#################### routes ################

on:       /simple
do:       simpleHandler

on:       /no-param-handler
do:       noParamHandler

on:       /uri
do:       urlTransformer uriValue

on:       GET /method-dependent-path      # http method GET + path match
do:       methodAndPathMatch

on:       POST PUT /method-dependent-path  # http method POST PUT + path match
do:       methodAndPathMatch

on:       POST PUT /decoded-map-entity
do:       decodedMapEntity

on:       POST PUT /decoded-seq-entity
do:       decodedSeqEntity

on:       POST PUT /decoded-string-entity
do:       decodedStringEntity

on:       POST PUT /decoded-dto-entity
do:       decodedDtoEntity

on:       /method-dependent-path
do:       methodAndPath

on:       /non-ascii-uri/glāžšķūņu rūķīši
do:       urlTransformer uriValue

on:       /response-transformer
do:       urlTransformer responseTransformer uriValue

on:       /echo
do:       echo

on:       /handler-transformer
do:       transformer echo

on:       /user
do:       testAuth respondWithUserName

on:       /user-info
do:       testAuth org.wabase.WabaseAuthentication.userPrincipal

on:       /long-handler-chain
do:       testAuth urlTransformer responseTransformer addUserData uriValue

on:       /greater/than-3/(\w+)
do:       keyExtractor keyChecker
recover:  testErrorHandler

# for dynamic route handler matching path first group must match handler name
on:       /do/([\w\.]+).*
do:       doRequest

# for view matching path first group must match [(create|count):]<view_name> (WabaseService.viewActionKey transformer)
on:       /public/([\w:]+)(.*)
do:       doAction

on:       /(login)
do:       extractBasicHttpCredentials setSessionCookie doAction

on:       /restricted/([\w:]+)(.*)
do:       authenticate setSessionCookie doAction

on:       /(user_data_merge)
do:       testAuth mergeUserData doAction

################# views ###############

name: view1
api: get, insert, update, delete, list, create, count
explicit db: true
table:
key: id
fields:
- id
- value
get:
- value = 'Value' || :id
insert:
- this
update:
- value = 'upd-' || :value
- this
delete:
- "'deleted ' || :id"
list:
- null {'"' || :list_filter_param || '"'}     # escape syntax due to yaml parser - '"' || :list_filter_param || '"' does not work
create:
- null {"[" || :p1 || ', "' || :p2 || '"]'}
count:
  - 1


name: login
api: get
explicit db: true
table:
get:
- roles = array ({trim('guest')} + {trim('admin')} + {trim('operator')})#(1)      # trim values for hsqldb to avoid space padding
- if :current_user.credentials.username = 'Gunza' & :current_user.credentials.password = 'good'
    (status ok
       user_attrs({'id', 10})
       user_attrs({'roles', |:'roles'})
    )
  else status 401


name: user_principal
api: get
explicit db: true
table:
get:
- as any :current_user


name: user_data_merge
api: get
explicit db: true
table:
get:
- status ok
    user_attrs({'password', null} /*remove attribute*/)
    user_attrs({'session_id', 'abcdefgh'})
