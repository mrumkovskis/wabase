#################### routes ################

on:       /simple
do:       simpleHandler

on:       /no-param-handler
do:       noParamHandler

on:       /uri
do:       urlTransformer uriValue

on:       GET /method-dependent-path      # http method GET + path match
do:       methodAndPathMatch

on:       POST PUT /method-dependent-path  # http method POST PUT + path match
do:       methodAndPathMatch

on:       POST PUT /decoded-map-entity
do:       decodedMapEntity

on:       POST PUT /decoded-seq-entity
do:       decodedSeqEntity

on:       POST PUT /decoded-string-entity
do:       decodedStringEntity

on:       POST PUT /decoded-dto-entity
do:       decodedDtoEntity

on:       /method-dependent-path
do:       methodAndPath

on:       /non-ascii-uri/glāžšķūņu rūķīši
do:       urlTransformer uriValue

on:       /response-transformer
do:       urlTransformer responseTransformer uriValue

on:       /echo
do:       echo

on:       /handler-transformer
do:       transformer echo

on:       /user
do:       testAuth respondWithUserName

on:       /user-info
do:       testAuth org.wabase.WabaseAuthentication.userPrincipal

on:       /long-handler-chain
do:       testAuth urlTransformer responseTransformer addUserData uriValue

on:       /greater/than-3/(\w+)
do:       keyExtractor keyChecker
recover:  testErrorHandler

on:       /(key_in_action)(.*)
do:       doAction $1
recover:  testErrorHandler

# for dynamic route handler matching path first group must match handler name
on:       /do/([\w\.]+).*
do:       doRequest $1

# for view matching path first group must match <view_name>[:(new|count)] (WabaseService.viewActionKey transformer)
on:       /public/([\w:]+)(.*)
do:       authenticateOpt doAction $1

on:       /(login)
do:       extractBasicHttpCredentials setSessionCookie doAction $1

on:       /restricted/(?<viewname>[\w:]+)(.*)
do:       authenticate doAction $1

on:       /(user_data_merge)
do:       testAuth mergeUserData doAction $1

# route with additional parameters - string constant, url matched group (numbering starts with 1)
on:       /static_resources/(.*\.txt)?
do:       staticResources('static_resources', $1)

# deep nested structure decoding for view
on:       POST PUT /deep-nested-view/(.+)
do:       org.wabase.handlers.RequestHandlers.viewActionKey($1) org.wabase.WabaseService.toMapForViewEntityDecoder

on:       POST PUT /deep-nested-data
do:       org.wabase.WabaseService.toMapEntityDecoder

# default error processing
on:       /error
do:       org.wabase.WabaseTestHandlers.error

# head method test
on:       GET HEAD /(head)
do:       doAction $1

# null test
on:       GET /(null_test)/(.*)
do:       doAction $1

# tresql handler args
on:       /tresql-arg/scalar/(\w+)
do:       org.wabase.WabaseTestHandlers.tresqlScalarArg('Hello ' || :name, $1)

on:       /tresql-arg/group-ref/(\w+)/(\w+)
do:       org.wabase.WabaseTestHandlers.tresqlScalarArg($1 || '-' || $2 || '-' || $1 || '-' || :name, $2)

on:       /tresql-arg/group-ref-single/(\w+)
do:       org.wabase.WabaseTestHandlers.tresqlScalarArg('<' || $1 || '>', 'x')

# group refs inside function args and subquery filter, not in textual order
on:       /tresql-arg/group-ref-nested/(\w+)/(\w+)
do:       org.wabase.WabaseTestHandlers.tresqlScalarArg(coalesce($2, '-') || ':' || (({1 id, 'x' name} ++ {2 id, 'y' name}) r [r.name = $1] {r.name || '.' || $2}), $1)

# path segments (0-based) via :__path
on:       /tresql-arg/path/(\w+)/(\w+)
do:       org.wabase.WabaseTestHandlers.tresqlScalarArg(:__path.2 || '+' || :__path.3 || '+' || $1, :__path.size)

# tresql macros in handler args
on:       /tresql-arg/macro
do:       org.wabase.WabaseTestHandlers.tresqlScalarArg(if_defined_or_else(:name?, 'Hello ' || :name, 'Hello nobody'), 'm')

# group refs inside a macro which drops one of its branches
on:       /tresql-arg/macro-group-ref/(\w+)/(\w+)
do:       org.wabase.WabaseTestHandlers.tresqlScalarArg(if_defined_or_else(:name?, $2 || '-' || :name, $1) || '/' || $2, $1)

on:       /tresql-arg/user
do:       testAuth org.wabase.WabaseTestHandlers.tresqlScalarArg(:current_user.name, 'user')

on:       /tresql-arg/any
do:       org.wabase.WabaseTestHandlers.tresqlAnyArg({1 id, 'x' name})

on:       /tresql-arg/dto-array
do:       org.wabase.WabaseTestHandlers.tresqlDtoArrayArg({1 id, 'x' name})

on:       /tresql-arg/dto
do:       org.wabase.WabaseTestHandlers.tresqlDtoArg({1 id, 'x' name})

on:       /tresql-arg/map
do:       org.wabase.WabaseTestHandlers.tresqlMapArg({1 id, 'x' name})

on:       /tresql-arg/dto-none
do:       org.wabase.WabaseTestHandlers.tresqlDtoArg(({1 id, 'x' name}) r [r.id = 2] {r.id, r.name})

on:       /tresql-arg/dto-many
do:       org.wabase.WabaseTestHandlers.tresqlDtoArg(({1 id, 'x' name} ++ {2 id, 'y' name}) r {r.id, r.name})

on:       /tresql-arg/dto-array-many
do:       org.wabase.WabaseTestHandlers.tresqlDtoArrayArg(({1 id, 'x' name} ++ {2 id, 'y' name}) r {r.id, r.name})

on:       /tresql-arg/iterator
do:       org.wabase.WabaseTestHandlers.tresqlIteratorArg({1 id})

################# views ###############

name: view1
api: get, update, update+, delete, list, new, count
paths:
  - /public/view1
  - /public/view1:new
  - /public/view1:count
explicit db: true
key: id
fields:
- id
- value
get:
- value = 'Value' || :id
update+:
- this
update:
- value = 'upd-' || :value
- this
delete:
- "'deleted ' || :id"
list:
- null {'"' || :list_filter_param || '"'}     # escape syntax due to yaml parser - '"' || :list_filter_param || '"' does not work
new:
- null {"[" || :p1 || ', "' || :p2 || '"]'}
count:
  - 1


name: login
api: get
explicit db: true
get:
- roles = [({trim('guest')} + {trim('admin')} + {trim('operator')})#(1)]      # trim values for hsqldb to avoid space padding
- if :current_user.credentials.username = 'Gunza' & :current_user.credentials.password = 'good'
    (status ok
       user_attrs({'id', 10})
       user_attrs({'roles', |:'roles'})
       'ok'
    )
  else status 401


name: user_principal
api: get, insert
paths: /restricted/user_principal
decoder: none
explicit db: true
get:
- as any :current_user
insert:
- status ok currentUser


name: user_data_merge
api: get
explicit db: true
get:
- status ok
    user_attrs({'password', null} /*remove attribute*/)
    user_attrs({'session_id', 'abcdefgh'})
    user_attrs({'roles', |[({trim('guest')} + {trim('admin')} + {trim('operator')})#(1)]} /*array query as child*/)


name: nested_view
api: insert, update
explicit db: true
fields:
- code int
- children * nested_view


name: querease_action_exception
api: get, insert, update
paths: /public/querease_action_exception
explicit db: true
decoder: none
get:
- org.wabase.WabaseTestHandlers.error
insert:
- org.wabase.WabaseTestHandlers.authError
update:
- org.wabase.WabaseTestHandlers.csrfException


name: key_in_action
api: get
explicit db: true
get:
- org.wabase.WabaseTestHandlers.keyInAction :code


name: entity_size_limit
api: insert
paths: /public/entity_size_limit
decoder: default 64b
explicit db: true
fields:
- id
- name
insert:
- this


name: state_extractor
api: get
paths: /public/state_extractor
explicit db: true
fields:
get:
- as any unique_opt { if_defined_or_else(:current_name?, :current_name, null) name,
    if_defined_or_else(:current_dept?, :current_dept, null) dept }


name: head
api: head, get
explicit db: true
head:
- response ok set_headers({'Last-Modified', 'Mon, 29 Sep 2025 22:18:54 EET'})
get:
- extract header Last-Modified http head /head


name: null_test
api: get
key: name
get:
- res = if {:name = null} 'name is null' else 'name = ' || :name
- as any :res
