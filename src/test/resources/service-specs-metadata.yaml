#################### routes ################

path: /simple
handler: simpleHandler

path: /uri
handler: urlTransformer uriValue

path: /response-transformer
handler: urlTransformer responseTransformer uriValue

path: /echo
handler: echo

path: /handler-transformer
handler: transformer echo

path: /user
handler: testAuth respondWithUserName

path: /long-handler-chain
handler: testAuth urlTransformer responseTransformer addUserData uriValue

path: /greater/than-3/(\w+)
handler: keyExtractor keyChecker
error-handler: testErrorHandler

path: /views/(\w+)(.*)
handler: doAction


################# views ###############

name: view1
api: get, insert
explicit db: true
table:
key: id
fields:
- id
- value
get:
- value = 'Value' || :id
insert:
- this
