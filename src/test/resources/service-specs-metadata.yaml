#################### routes ################

path: /simple
do: simpleHandler

path: /uri
do: urlTransformer uriValue

path: /response-transformer
do: urlTransformer responseTransformer uriValue

path: /echo
do: echo

path: /handler-transformer
do: transformer echo

path: /user
do: testAuth respondWithUserName

path: /long-handler-chain
do: testAuth urlTransformer responseTransformer addUserData uriValue

path: /greater/than-3/(\w+)
do: keyExtractor keyChecker
recover: testErrorHandler

# for view matching path first group must match [(create|count):]<view_name> (WabaseService.viewActionKey transformer)
path: /views/([\w:]+)(.*)
do: doAction


################# views ###############

name: view1
api: get, insert, update, delete, list, create, count
explicit db: true
table:
key: id
fields:
- id
- value
get:
- value = 'Value' || :id
insert:
- this
update:
- value = 'upd-' || :value
- this
delete:
- "'deleted ' || :id"
list:
- null {'"' || :list_filter_param || '"'}     # escape syntax due to yaml parser - '"' || :list_filter_param || '"' does not work
create:
- null {"[" || :p1 || ', "' || :p2 || '"]'}
count:
  - 1
