pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  # Options: OFF, ERROR, WARNING, INFO, DEBUG
  loglevel = "DEBUG"
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
}

pekko.http {
  host-connection-pool.max-open-requests = 128
}

app {
  # Unit tests assert full Location paths (e.g. /data/by_key_view_1?/...)
  crud-redirects = absolute

  deferred-requests.modules.audit.worker-count = 2
  deferred-requests.requests                   = [slow-req]
  deferred-requests.timeouts.slow-req          = 300 s
  deferred-requests.worker-count               = 3

  public-api.views-uri-prefix = "/"
  public-api.views-location-pattern = "(?!(roles-test)).*\\.yaml"  # path/and/filename pattern to allow access to view api without user and role check

  wabase-call-alias {
    stringArgument            = org.wabase.QuereaseActionTestManagerObj.stringArgument
    multipleStringArguments   = org.wabase.QuereaseActionTestManagerObj.multipleStringArguments
    multipleArguments         = org.wabase.QuereaseActionTestManagerObj.multipleArguments
    simpleHandler             = org.wabase.WabaseTestHandlers.simpleHandler
    urlTransformer            = org.wabase.WabaseTestHandlers.urlTransformer
    uriValue                  = org.wabase.WabaseTestHandlers.uriValue
    responseTransformer       = org.wabase.WabaseTestHandlers.responseTransformer
    echo                      = org.wabase.WabaseTestHandlers.echo
    transformer               = org.wabase.WabaseTestHandlers.transformer
    testAuth                  = org.wabase.WabaseTestHandlers.testAuth
    respondWithUserName       = org.wabase.WabaseTestHandlers.respondWithUserName
    mergeUserData             = org.wabase.WabaseTestHandlers.mergeUserData
    addUserData               = org.wabase.WabaseTestHandlers.addUserData
    keyExtractor              = org.wabase.WabaseTestHandlers.keyExtractor
    keyChecker                = org.wabase.WabaseTestHandlers.keyChecker
    testErrorHandler          = org.wabase.WabaseTestHandlers.errorHandler
    methodAndPathMatch        = org.wabase.WabaseTestHandlers.methodAndPathMatch
    methodAndPath             = org.wabase.WabaseTestHandlers.methodAndPath
    noParamHandler            = org.wabase.WabaseTestHandlers.noParamHandler
    decodedMapEntity          = org.wabase.WabaseTestHandlers.decodedMapEntity
    decodedSeqEntity          = org.wabase.WabaseTestHandlers.decodedSeqEntity
    decodedStringEntity       = org.wabase.WabaseTestHandlers.decodedStringEntity
    decodedDtoEntity          = org.wabase.WabaseTestHandlers.decodedDtoEntity
    test_handler              = org.wabase.WabaseTestHandlers.testHandler
    map_handler               = org.wabase.WabaseTestHandlers.map_handler
    seq_handler               = org.wabase.WabaseTestHandlers.seq_handler
    dto_handler               = org.wabase.WabaseTestHandlers.dto_handler
    dto_seq_handler           = org.wabase.WabaseTestHandlers.dto_seq_handler
    staticResources           = org.wabase.WabaseTestHandlers.staticResources
    currentUser               = org.wabase.WabaseTestHandlers.currentUser
  }

  wabase-authorization.class = org.wabase.TestAuthorization

  wabase-injection-parameters-provider-factory = org.wabase.UserParameterProviderFactory

  script-validations {
    load-validations = org.wabase.TestValidationEngine.loadValidations
  }

  job {
    scheduler-initializer = org.wabase.scheduler.QuartzScheduler.init
    clean-jobs-on-start = false
    job-status-cp = wabase_db
  }

  json-encoder-customization = org.wabase.MarshallingSpecs.customJsonEncoder

  template {
    # Unit tests: template body loader
    dir = "src/test/resources/templates"
    classpath-prefix = "/templates/"
    assets {
      # Unit tests: filesystem fixtures under src/test/resources (resolved from project root)
      directories = ["src/test/resources/pdf-assets"]
      classpath-prefixes = ["/fonts/"]
    }
  }
}

conf.test {
  uri = "http://wabase.org/"
  list = [1, 2, 3]
  enabled = true
  request-timeout = 10
}

data.timezone = "+03:00"

http-client {
  fast {
    request-timeout = 2 s
  }
  slow {
    request-timeout = 50 s
    await-timeout   = 55 s
  }
}

small-file.upload.size-limit = 1k

