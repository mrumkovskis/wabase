table: msg_ops_dummy
columns:
- id
- value


name: msg_read_to
fields:
- topic
get:
- msg read from={:topic topic} to={:value = 'c'}


name: msg_read_map
fields:
- topic
get:
- msg read from={:topic topic} key='k' to={:id = 2 & :k = 'k2'} timeout={'10s' within}


name: msg_read_metadata
fields:
- topic
get:
- msg read from={:topic topic, 0 partition, 1 offset} to={:__metadata.offset = 2}


name: msg_read_idle
fields:
- topic
get:
- msg read from={:topic topic, 0 partition} timeout={'500ms' idle}  # assignment - no group join delay


name: msg_read_commit
fields:
- topic
- group
get:
- msg read group=:group from={:topic topic} committer={'OffsetFirstObserved' commit_when} commit_metadata=('m-' || :value) to={:value = 'b'}


name: msg_read_step
fields:
- topic
get:
- msgs = msg read from=:topic timeout={'5s' idle}  # group subscription - idle includes group join
- :msgs.size


name: msg_read_errors
fields:
- topic
get:
- msg read from={:topic topic} committer={1 max_bach}
list:
- msg read [unknown] from={:topic topic}


name: msg_admin_topics
get:
- msg topics


name: msg_admin_partitions
fields:
- topic
get:
- msg topic partitions [main] {:topic topic}


name: msg_admin_offsets
fields:
- topic
get:
- msg beginning offsets {:topic topic, 0 partition} ++ {:topic topic, 1 partition}
list:
- msg end offsets [main] {:topic topic, 0 partition} ++ {:topic topic, 1 partition}


name: msg_admin_committed
fields:
- topic
- group
get:
- msg committed offsets {:group group_id, :topic topic, 0 partition} ++ {'g-none' group_id, :topic topic, 0 partition}


name: msg_read_from_table
fields:
- id
get:  # parameters are evaluated with action's resources - may access action's database tables
- msg read from=msg_ops_dummy[id = :id]{value topic, 0 partition} timeout={'500ms' idle}


name: msg_read_db_tresql
fields:
- topic
get:  # per message tresql runs with action's resources - 'to' queries action's database
- msg read from={:topic topic, 0 partition} to={exists(msg_ops_dummy[id = :value::int & value = 'stop'])}
    timeout={'10s' idle}
list:  # foreach body queries action's database without db block
- foreach msg read from={:topic topic, 0 partition} timeout={'500ms' idle}:
  - msg_ops_dummy[id = :value::int]{value}


name: msg_send_per_message
fields:
- src
- prefix
get:  # parameters evaluated per message - topic, key, header, key codec; operation variables with '..'
- msg send to=(:'..'.prefix || :region) key={:k || '!' value} headers={'region' name, :region value}
    using={:kc key} msg read from={:'..'.src topic, 0 partition} timeout={'1s' idle}
list: # multi send - topic per element, result rows per destination and topic
- msg multi send:
  - ({1 id, 'eu' region} ++ {2 id, 'us' region} ++ {3 id, 'eu' region})
  - to:
    - msg send to=(:'..'.prefix || :region) key={:id value}
    - msg send to=(:'..'.prefix || 'none') filter={:id = 0}


name: msg_send_rows
fields:
- topic
get:
- msg send to={:'..'.topic topic, 1 partition} key={'id' name, true should_remove} headers={'h' name, 'v' value}:
  - "{1 id, 'a' name} ++ {2 id, 'b' name}"
list:  # scalar - one message, explicit key
- msg send to=:'..'.topic key={'k' value} ('x')


name: msg_send_forward
fields:
- src
- dst
- group
get:  # forward read messages with commit, value and key retained
- msg send to=:'..'.dst msg read group=:group from=:src committer=true to={:value = 'c'}


name: msg_foreach
fields:
- topic
get:
- foreach msg read from={:topic topic, 0 partition} to={:value = 'c'}:
  - :value || '!'
list:  # item variable, metadata, index
- foreach m in msg read from={:topic topic, 0 partition} timeout={'500ms' idle}:
  - unique {:m m, :__metadata.offset off, :__idx idx}
count:  # fold
- n = 0
- foreach msg read from={:topic topic, 0 partition} timeout={'500ms' idle} fold (n, x) {:n + :x}:
  - :value


name: msg_foreach_send
fields:
- src
- dst
- group
get:  # transform, filter (b) and forward with commit
- msg send to=:'..'.dst:
  - foreach msg read group=:group from=:src committer=true to={:value = 'd'}:
    - if {:value != 'b'}:
      - :value || '!'


name: msg_foreach_db
fields:
- topic
get:  # body opens its own transaction - action's connection is not used for message processing
- foreach msg read from={:topic topic, 0 partition} timeout={'500ms' idle}:
  - transaction:
    - +msg_ops_dummy {id = :id, value = :name}
  - :name


name: msg_foreach_collect
fields:
- topic
- group
get:  # collect committable foreach result with filtered message (b)
- msgs = foreach msg read group=:group from=:topic committer=true to={:value = 'c'}:
  - if {:value != 'b'}:
    - :value
- :msgs.size


name: msg_read_restart
fields:
- src
- dst
get:  # reader failure (flaky provider) restarts reader - messages before failure are read again
- msg send to=:'..'.dst msg read [flaky] from={:src topic, 0 partition}
    restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor, 2 max_restarts, '10s' max_restarts_within}


name: msg_read_commit_restart
fields:
- topic
- group
get:  # commit failure (flaky provider) restarts reading, processing and committing
- msgs = foreach msg read [flaky] group=:group from=:topic committer=true to={:value = 'c'} restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - org.wabase.MsgOpsTestFunctions.record
- :msgs.size
list:  # processing failure is not restarted
- foreach msg read group=:group from=:topic committer=true to={:value = 'c'} restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - org.wabase.MsgOpsTestFunctions.recordFailOnB
count:  # reader failure (flaky provider) is restarted until max restarts
- foreach msg read [flaky] group=:group from=:topic committer=true restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor, 2 max_restarts, '10s' max_restarts_within}:
  - org.wabase.MsgOpsTestFunctions.record
insert:  # timeout 'within' includes restarts
- foreach msg read [flaky] group=:group from=:topic committer=true timeout={'2s' within} restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - org.wabase.MsgOpsTestFunctions.record
update:  # foreach index starts from 0 for each attempt
- msgs = foreach msg read [flaky] group=:group from=:topic committer=true to={:value = 'c'} restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - org.wabase.MsgOpsTestFunctions.recordIdx
- :msgs.size
delete:  # reader configuration error (missing group) fails msg read - not restarted by msg send restart
- msg send to='x' restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - msg read [nogroup] from=:topic committer=true


name: msg_read_decode_error
fields:
- topic
- group
- dst
get:  # decoding failure is not restarted
- foreach msg read group=:group from=:topic committer=true to={:value = 'c'} restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - org.wabase.MsgOpsTestFunctions.record
list:  # message which cannot be decoded is skipped and committed
- foreach msg read group=:group from=:topic committer=true to={:value = 'c'} decode_error='skip':
  - org.wabase.MsgOpsTestFunctions.record
count:  # skipped by reader without committer
- msg read from={:topic topic, 0 partition} to={:value = 'c'} decode_error='skip'
insert:  # decoding failure is not restarted by msg send restart
- msg send to=:'..'.dst restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - msg read group=:group from=:topic committer=true
update:  # decoding failure is not restarted by reader restart
- msg read from={:topic topic, 0 partition} restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}


name: msg_send_restart
fields:
- src
- dst
- group
get:  # transient processing failure restarts read, processing, send and commit
- msg send to=:'..'.dst restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - foreach msg read group=:group from=:src committer=true to={:value = 'd'}:
    - org.wabase.MsgOpsTestFunctions.failOnce
list:  # restart requires messaging result
- msg send to=:'..'.dst restart=true ('x')
count:  # parameter error (unknown codec) is not restarted
- msg send to=:'..'.dst restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor} using='jsn'
    msg read from={:src topic, 0 partition} timeout={'5s' idle}
insert: # missing bind variable (operation variable without '..') is not restarted
- msg send to=:dst restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}
    msg read from={:src topic, 0 partition} timeout={'5s' idle}


name: msg_review_fixes
fields:
- topic
get:   # foreach over rows - no result of 'if' without 'else' is not sent
- msg send to=:'..'.topic:
  - foreach ({1 x} ++ {2 x}):
    - if {:x = 1}:
      - :x
list:  # foreach over messaging result wrapped in db result
- foreach (db use msg read from={:topic topic, 0 partition} timeout={'500ms' idle}) (:value || '?')


name: msg_send_filter
fields:
- src
- dst
- group
- skip
get:  # forward filtered messages keeping key, filtered messages committed; key bind variable
- msg send to=:'..'.dst filter={:status != 'draft' & :k != 'k4'}
    msg read group=:group from=:src committer=true key='k' to={:status = 'end'}
list: # filter rows - map fields, parent scope with '..'
- msg send to=:'..'.dst filter={:id::int != :'..'.skip::int} ({1 id} ++ {2 id} ++ {3 id})


name: msg_send_filter_value
fields:
- src
- dst
- group
get:  # foreach result - scalar bound as value, committed after filtering
- msg send to=:'..'.dst filter={:value != 'b!'}:
  - foreach msg read group=:group from=:src committer=true to={:value = 'c'}:
    - :value || '!'
list: # single value filtered out
- msg send to=:'..'.dst filter={:value != 'b'} ('b')
count: # filter must be boolean
- msg send to=:'..'.dst filter=(:'..'.dst) ('x')


name: msg_send_db
fields:
- topic
get:   # query rows are streamed from db block's cursor, which is closed after messages are sent
- db use:
  - msg send to=:'..'.topic msg_ops_dummy[id >= 1000]{id, value}#(id)
list:  # single row with single column - value is sent
- msg send to=:'..'.topic msg_ops_dummy[id = 1000]{value}


name: msg_multi_send
fields:
- src
- group
- eu
- us
- all
- dst
- dst2
get:  # routing (filter, operation), transformation, copy; committing messaging source
- msg multi send:
  - msg read group=:group from=:src committer=true key='k' to={:status = 'end'}
  - to:
    - msg send to=:'..'.eu filter={:region = 'eu'}
    - msg send to=:'..'.us key={'id' name}:
      - if {:region = 'us'} (unique {:id::int id, :status status})
    - msg send to=:'..'.all
list: # rows source, splitting (operation returning rows), __idx, parent scope
- tag = 't'
- msg multi send:
  - ({1 id} ++ {2 id})
  - to:
    - msg send to=:'..'.dst ({:id::int id, :__idx::int idx, :'..'.tag tag} ++ {:id::int + 10 id, :__idx::int idx, :'..'.tag tag})
    - msg send to=:'..'.dst2 filter={:id::int = 2}
count: # restart requires messaging result
- msg multi send restart=true:
  - "'x'"
  - to:
    - msg send to=:'..'.dst


name: msg_multi_send_db
fields:
- dst
get:  # destination operation queries action's connection while query source rows are read
- msg multi send:
  - msg_ops_dummy[id >= 1000 & id < 1010]{id}#(id)
  - to:
    - msg send to=:'..'.dst (msg_ops_dummy[id = :id]{value})


name: msg_multi_send_restart
fields:
- src
- dst
- copy
- group
get:  # transient failure in destination operation restarts read, processing, send and commit
- msg multi send restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - msg read group=:group from=:src committer=true to={:value = 'd'}
  - to:
    - msg send to=:'..'.copy
    - msg send to=:'..'.dst (org.wabase.MsgOpsTestFunctions.failOnce)


name: msg_multi_send_split
fields:
- src
- dst
- copy
- group
get:  # incoming message split into several messages - committed after the last one, also before the last stage
- msg multi send:
  - msg read group=:group from=:src committer=true to={:value = 'c'}
  - to:
    - msg send to=:'..'.dst ({:value || '1' v} ++ {:value || '2' v})
    - msg send to=:'..'.copy


name: msg_send_compat_src
fields:
- src
- group
get:
- msg read group=:group from=:src committer=true to={:value = 'c'}


name: msg_send_compat
fields:
- src
- dst
- group
get:  # messaging result of view call with result type (CompatibleResult) - committed after sending
- msg send to=:'..'.dst (as any get msg_send_compat_src)
list: # the same with restart
- msg send to=:'..'.dst restart={'50ms' min_backoff, '100ms' max_backoff, 0 random_factor}:
  - as any get msg_send_compat_src
count: # multi send
- msg multi send:
  - as any get msg_send_compat_src
  - to:
    - msg send to=:'..'.dst


name: msg_multi_send_idx
fields:
- src
- dst
- group
get:  # __idx does not count messages filtered by foreach, like foreach
- msg multi send:
  - foreach msg read group=:group from=:src committer=true to={:value = 'c'}:
    - if {:value != 'b'} (:value)
  - to:
    - msg send to=:'..'.dst (:value || :__idx)
list:  # message skipped by reader (decoding error) is committed, not sent and not counted by __idx
- msg multi send:
  - msg read group=:group from=:src committer=true to={:value = 'c'} decode_error='skip'
  - to:
    - msg send to=:'..'.dst (:value || :__idx)
count:  # message skipped by reader is committed, not sent
- msg send to=:'..'.dst msg read group=:group from=:src committer=true to={:value = 'c'} decode_error='skip'
