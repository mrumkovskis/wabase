name:   api_error_test_1
api:    get, get # bad api - duplicate method


name:   api_error_test_2
api:    get, MANAGER # bad - no methods for manager


name:   recover_error_test_1
get:  # bad - recover step has no steps to guard
- recover:
  - x = 'R'


name:   recover_error_test_2
get:  # bad - second recover step has no steps to guard
- x = 'A'
- recover:
  - x = 'R1'
- recover:
  - x = 'R2'


name:   throw_error_test_1
get:  # bad - 'rethrow' is not inside recover step action
- x = 'A'
- rethrow


name:   throw_error_test_2
get:  # bad - 'rethrow' does not take arguments
- x = 'A'
- recover:
  - rethrow :wabase_error.exception


name:   msg_multi_send_error_1
get:  # bad - no 'to' block
- msg multi send:
  - "'x'"


name:   msg_multi_send_error_2
get:  # bad - destination is not msg send
- msg multi send:
  - "'x'"
  - to:
    - "'y'"


name:   msg_multi_send_error_3
get:  # bad - destination with restart
- msg multi send:
  - "'x'"
  - to:
    - msg send to='t' restart=true


name:   msg_multi_send_error_4
get:  # bad - msg send without operation outside multi send
- msg send to='t'


name:   msg_multi_send_error_5
get:  # bad - no source steps
- msg multi send:
  - to:
    - msg send to='t'
