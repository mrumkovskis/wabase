name: Build and test
on:   [push]
jobs:
  Build-and-test:
    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:     [ubuntu-24.04]    # TODO macos-latest, windows-latest
        java:   [11] #, 17, 21]   # TODO
        scala:  ["2.12.21", "2.13.18", "3.3.8"]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: sbt
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Compile and test and check version policy
      # sbt -Dhsqldb.method_class_names="test.HsqldbCustomFunctions.*" clean update +compile +test:compile +test +it/test:compile +it/test +it_legacy/test:compile +it_legacy/test +versionPolicyCheck
      run: >
        sbt -Dhsqldb.method_class_names="test.HsqldbCustomFunctions.*"
        "++${{ matrix.scala }}"
        clean update compile
        test:compile            test
        it/test:compile         it/test
        it_legacy/test:compile  it_legacy/test
        versionPolicyCheck
